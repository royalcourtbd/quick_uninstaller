name: Deploy to Play Store Internal Testing (No Release)

on:
  push:
    branches:
      - deployment
  workflow_dispatch:
    inputs:
      version_override:
        description: "Override version code (leave empty for auto-increment)"
        required: false
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: quick-uninstaller-play-store-deploy
  cancel-in-progress: false

env:
  JAVA_VERSION: "17"
  FLUTTER_VERSION: "3.41.4"
  NODE_VERSION: "22"
  PACKAGE_NAME: ${{ vars.PACKAGE_NAME || 'com.amatullah.quickuninstaller' }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Record start time
        id: start_time
        run: echo "start=$(date +%s)" >> $GITHUB_OUTPUT

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}
          cache: "gradle"

      - name: Setup Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.npm
            android/.gradle
          key: ${{ runner.os }}-deps-${{ hashFiles('**/pubspec.lock', '**/gradle-wrapper.properties', '**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-deps-

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_FILE }}
        run: |
          set -e
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks

      - name: Create key.properties
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -e
          echo "storePassword=$STORE_PASSWORD" > android/key.properties
          echo "keyPassword=$KEY_PASSWORD" >> android/key.properties
          echo "keyAlias=$KEY_ALIAS" >> android/key.properties
          echo "storeFile=upload-keystore.jks" >> android/key.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Resolve Android version
        id: version
        env:
          PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}
          VERSION_CODE_OVERRIDE: ${{ inputs.version_override }}
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts googleapis --silent

          node <<'NODE'
          const fs = require('fs');
          const { execFileSync } = require('child_process');
          const { google } = require('googleapis');

          const MAX_ANDROID_VERSION_CODE = 2100000000;

          function parseVersionName(value, label) {
            const match = /^(\d+)\.(\d+)\.(\d+)$/.exec(value);
            if (!match) {
              throw new Error(`${label} must use major.minor.patch format, received: "${value}"`);
            }

            const parts = match.slice(1).map(Number);
            if (parts.some(part => !Number.isSafeInteger(part))) {
              throw new Error(`${label} contains a number that is too large: "${value}"`);
            }

            return {
              raw: value,
              major: parts[0],
              minor: parts[1],
              patch: parts[2],
            };
          }

          function compareVersions(left, right) {
            for (const key of ['major', 'minor', 'patch']) {
              if (left[key] !== right[key]) {
                return left[key] > right[key] ? 1 : -1;
              }
            }
            return 0;
          }

          function parseVersionCode(value, label, allowZero = false) {
            if (!/^\d+$/.test(String(value))) {
              throw new Error(`${label} must be a positive integer, received: "${value}"`);
            }

            const number = Number(value);
            const minimum = allowZero ? 0 : 1;
            if (!Number.isSafeInteger(number) || number < minimum || number > MAX_ANDROID_VERSION_CODE) {
              throw new Error(
                `${label} must be between ${minimum} and ${MAX_ANDROID_VERSION_CODE}, received: "${value}"`,
              );
            }
            return number;
          }

          function highestVersionCode(items) {
            let highest = 0;
            for (const item of items) {
              const value = parseVersionCode(item, 'Play Store version code', true);
              highest = Math.max(highest, value);
            }
            return highest;
          }

          async function main() {
            const pubspec = fs.readFileSync('pubspec.yaml', 'utf8');
            const versionMatch = /^version:\s*([^\s#]+)\s*(?:#.*)?$/m.exec(pubspec);
            if (!versionMatch) {
              throw new Error('Could not find the version field in pubspec.yaml');
            }

            const [pubspecNameRaw, pubspecCodeRaw] = versionMatch[1].split('+');
            const pubspecVersion = parseVersionName(pubspecNameRaw, 'pubspec version');

            let fallbackCode;
            if (pubspecCodeRaw) {
              fallbackCode = parseVersionCode(pubspecCodeRaw, 'pubspec build number');
            } else {
              const commitCount = execFileSync('git', ['rev-list', '--count', 'HEAD'], {
                encoding: 'utf8',
              }).trim();
              fallbackCode = parseVersionCode(commitCount, 'Git commit count');
            }

            if (!process.env.PLAY_STORE_JSON_KEY) {
              throw new Error('PLAY_STORE_JSON_KEY is not configured');
            }

            let credentials;
            try {
              credentials = JSON.parse(process.env.PLAY_STORE_JSON_KEY);
            } catch {
              throw new Error('PLAY_STORE_JSON_KEY is not valid JSON');
            }

            const auth = new google.auth.GoogleAuth({
              credentials,
              scopes: ['https://www.googleapis.com/auth/androidpublisher'],
            });
            const androidPublisher = google.androidpublisher({ version: 'v3', auth });
            const packageName = process.env.PACKAGE_NAME;

            let editId;
            let failure;
            let tracks = [];
            let bundles = [];
            let apks = [];

            try {
              const editResponse = await androidPublisher.edits.insert({ packageName });
              editId = editResponse.data.id;

              const [tracksResponse, bundlesResponse, apksResponse] = await Promise.all([
                androidPublisher.edits.tracks.list({ packageName, editId }),
                androidPublisher.edits.bundles.list({ packageName, editId }),
                androidPublisher.edits.apks.list({ packageName, editId }),
              ]);

              tracks = tracksResponse.data.tracks || [];
              bundles = bundlesResponse.data.bundles || [];
              apks = apksResponse.data.apks || [];
            } catch (error) {
              failure = error;
            } finally {
              if (editId) {
                try {
                  await androidPublisher.edits.delete({ packageName, editId });
                } catch (cleanupError) {
                  if (failure) {
                    console.error(`Failed to delete Play edit ${editId}: ${cleanupError.message}`);
                  } else {
                    failure = cleanupError;
                  }
                }
              }
            }

            if (failure) {
              throw new Error(`Could not read Google Play version information: ${failure.message}`);
            }

            let highestTrackCode = 0;
            let internalVersionCode = 0;
            let internalVersionName = '';

            for (const track of tracks) {
              for (const release of track.releases || []) {
                for (const code of release.versionCodes || []) {
                  const parsedCode = parseVersionCode(code, 'Play Store version code', true);
                  highestTrackCode = Math.max(highestTrackCode, parsedCode);

                  if (track.track === 'internal' && parsedCode > internalVersionCode) {
                    internalVersionCode = parsedCode;
                    internalVersionName = (release.name || '').trim();
                  }
                }
              }
            }

            const highestBundleCode = highestVersionCode(
              bundles.map(bundle => bundle.versionCode).filter(code => code != null),
            );
            const highestApkCode = highestVersionCode(
              apks.map(apk => apk.versionCode).filter(code => code != null),
            );
            const playStoreCode = Math.max(highestTrackCode, highestBundleCode, highestApkCode);

            let nextVersionName = pubspecVersion.raw;
            let versionDecision = 'No Internal release found; using pubspec version';

            if (internalVersionCode > 0) {
              if (!internalVersionName) {
                throw new Error(
                  `Internal release ${internalVersionCode} has no release name to use as versionName`,
                );
              }

              const internalVersion = parseVersionName(
                internalVersionName,
                'Internal release version',
              );
              const comparison = compareVersions(pubspecVersion, internalVersion);

              if (comparison > 0) {
                nextVersionName = pubspecVersion.raw;
                versionDecision = 'pubspec version is newer; using it without a patch increment';
              } else if (
                pubspecVersion.major === internalVersion.major &&
                pubspecVersion.minor === internalVersion.minor
              ) {
                if (internalVersion.patch === Number.MAX_SAFE_INTEGER) {
                  throw new Error(`Internal patch number is too large to increment: ${internalVersion.raw}`);
                }
                nextVersionName =
                  `${internalVersion.major}.${internalVersion.minor}.${internalVersion.patch + 1}`;
                versionDecision = 'same major/minor line; incrementing the Internal patch';
              } else {
                throw new Error(
                  `Internal version ${internalVersion.raw} is ahead of pubspec version ` +
                  `${pubspecVersion.raw} on a different major/minor line. Update pubspec.yaml first.`,
                );
              }
            }

            const override = (process.env.VERSION_CODE_OVERRIDE || '').trim();
            let buildNumber;

            if (override) {
              buildNumber = parseVersionCode(override, 'Manual version code override');
              if (buildNumber <= playStoreCode) {
                throw new Error(
                  `Manual version code ${buildNumber} must be greater than Play Store code ${playStoreCode}`,
                );
              }
            } else {
              buildNumber = Math.max(playStoreCode, fallbackCode) + 1;
              if (buildNumber > MAX_ANDROID_VERSION_CODE) {
                throw new Error(`Calculated version code exceeds ${MAX_ANDROID_VERSION_CODE}`);
              }
            }

            fs.appendFileSync(
              process.env.GITHUB_OUTPUT,
              [
                `version_name=${nextVersionName}`,
                `build_number=${buildNumber}`,
                `pubspec_version=${pubspecVersion.raw}`,
                `internal_version=${internalVersionName || 'none'}`,
                `play_store_code=${playStoreCode}`,
                '',
              ].join('\n'),
            );

            console.log(`Pubspec version: ${pubspecVersion.raw}`);
            console.log(`Internal version: ${internalVersionName || 'none'}`);
            console.log(`Version decision: ${versionDecision}`);
            console.log(`Build versionName: ${nextVersionName}`);
            console.log(`Highest Play Store versionCode: ${playStoreCode}`);
            console.log(`Build versionCode: ${buildNumber}`);
          }

          main().catch(error => {
            console.error(error.message);
            process.exit(1);
          });
          NODE

      - name: Build AAB
        run: |
          flutter build appbundle --release \
            --obfuscate --split-debug-info=build/app/outputs/symbols \
            --build-name=${{ steps.version.outputs.version_name }} \
            --build-number=${{ steps.version.outputs.build_number }}

      - name: Clean up old debug symbol artifacts
        uses: actions/github-script@v9
        continue-on-error: true
        with:
          script: |
            const { data: { artifacts } } = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const symbolArtifacts = artifacts.filter(a => a.name.startsWith('debug-symbols-'));
            console.log(`Found ${symbolArtifacts.length} debug-symbol artifacts`);
            for (const artifact of symbolArtifacts) {
              console.log(`Deleting: ${artifact.name} (${artifact.id})`);
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id,
              });
            }

      - name: Upload debug symbols as artifact
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: debug-symbols-${{ steps.version.outputs.build_number }}
          path: build/app/outputs/symbols/
          retention-days: 15

      - name: Upload debug symbols to Firebase Crashlytics
        continue-on-error: true
        timeout-minutes: 10
        run: |
          npm install -g firebase-tools
          export GOOGLE_APPLICATION_CREDENTIALS="firebase-sa.json"
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}' > firebase-sa.json
          firebase crashlytics:symbols:upload \
            --app=${{ secrets.FIREBASE_APP_ID }} \
            build/app/outputs/symbols/
          rm -f firebase-sa.json

      - name: Verify AAB
        id: aab_info
        run: |
          if [ ! -f "build/app/outputs/bundle/release/app-release.aab" ]; then
            echo "AAB file not found!"
            exit 1
          fi
          AAB_SIZE=$(du -h build/app/outputs/bundle/release/app-release.aab | cut -f1)
          echo "AAB built successfully ($AAB_SIZE)"
          echo "aab_size=$AAB_SIZE" >> $GITHUB_OUTPUT

      - name: Generate Play Store release notes
        run: |
          mkdir -p whatsnew

          if [ -f "whatsnew/whatsnew-en-US" ]; then
            echo "Using manual What's New (en-US) from repo"
          else
            PREVIOUS_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            if [ -n "$PREVIOUS_TAG" ]; then
              git log "$PREVIOUS_TAG"..HEAD --oneline --pretty=format:"- %s" | head -c 500 > whatsnew/whatsnew-en-US
            else
              echo "- Initial release" > whatsnew/whatsnew-en-US
            fi
          fi

          if [ -f "whatsnew/whatsnew-bn-BD" ]; then
            echo "Using manual What's New (bn-BD) from repo"
          else
            cp whatsnew/whatsnew-en-US whatsnew/whatsnew-bn-BD
          fi

      - name: Upload to Play Store Internal Testing
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON_KEY }}
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          tracks: internal
          status: completed
          releaseName: ${{ steps.version.outputs.version_name }}
          whatsNewDirectory: whatsnew/

      - name: Calculate build duration
        if: always()
        id: duration
        run: |
          set -e
          END_TIME=$(date +%s)
          START_TIME=${{ steps.start_time.outputs.start }}
          DURATION=$((END_TIME - START_TIME))
          MINUTES=$((DURATION / 60))
          SECONDS=$((DURATION % 60))
          echo "time=${MINUTES}m ${SECONDS}s" >> $GITHUB_OUTPUT

      - name: Format build date
        if: always()
        id: build_date
        run: |
          BUILD_DATE=$(TZ='Asia/Dhaka' date +'%d %B %Y - %l:%M%p' | sed 's/AM/am/g; s/PM/pm/g; s/  / /g')
          echo "BUILD_DATE=$BUILD_DATE" >> $GITHUB_OUTPUT

      - name: Notify Slack
        if: always()
        uses: slackapi/slack-github-action@v3.0.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "${{ job.status == 'success' && 'Quick Uninstaller Internal Deploy' || 'Quick Uninstaller Internal Deploy Failed' }}",
                    "emoji": true
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Version:*\n`${{ steps.version.outputs.version_name || 'N/A' }}`"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Build Number:*\n`${{ steps.version.outputs.build_number || 'N/A' }}`"
                    }
                  ]
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*AAB Size:*\n`${{ steps.aab_info.outputs.aab_size || 'N/A' }}`"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Build Time:*\n`${{ steps.duration.outputs.time || 'N/A' }}`"
                    }
                  ]
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Status:*\n`${{ job.status }}`"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Triggered by:*\n`${{ github.actor }}`"
                    }
                  ]
                },
                {
                  "type": "context",
                  "elements": [
                    {
                      "type": "mrkdwn",
                      "text": "Build Date: ${{ steps.build_date.outputs.BUILD_DATE || 'N/A' }}"
                    }
                  ]
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "Play Store",
                        "emoji": true
                      },
                      "url": "https://play.google.com/store/apps/details?id=${{ env.PACKAGE_NAME }}",
                      "style": "primary"
                    }
                  ]
                }
              ]
            }
